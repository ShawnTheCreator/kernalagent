
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernal Agent — Cognitive Desktop Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Geist Mono', 'monospace'],
            },
            colors: {
              kernel: {
                bg: '#050505',
                card: '#0A0A0A',
                border: '#1A1A1A',
                accent: '#3B82F6',
                muted: '#71717A',
              }
            },
            animation: {
              'slow-pulse': 'slow-pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              'slow-pulse': {
                '0%, 100%': { opacity: 0.1, transform: 'scale(1)' },
                '50%': { opacity: 0.2, transform: 'scale(1.1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: #F4F4F5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .cinematic-mask {
        mask-image: linear-gradient(to bottom, black 0%, black 80%, transparent 100%);
      }
      .text-reveal span {
        display: inline-block;
        opacity: 0.2;
        transition: opacity 0.8s ease-out;
      }
      .text-reveal.active span {
        opacity: 1;
      }
      .glass-panel {
        background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
        border: 1px solid rgba(255,255,255,0.08);
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #1A1A1A; border-radius: 10px; }
      
      .parallax-bg {
        background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #050505 60%);
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",

    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>

</head>

    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
